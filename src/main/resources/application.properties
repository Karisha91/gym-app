spring.application.name=gym-app
spring.datasource.url=jdbc:postgresql://localhost:5433/gym_db
spring.datasource.username=gym_user
spring.datasource.password=gym_password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


# OpenRouter AI Configuration
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=liquid/lfm-3-1.7b:free
openrouter.connect-timeout=3s
openrouter.read-timeout=10s